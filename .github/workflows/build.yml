name: Build AScan AgenT 2.0 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          python3-setuptools \
          autoconf \
          automake \
          libtool \
          libltdl-dev \
          libltdl7 \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          gettext \
          autopoint \
          build-essential \
          ccache

    - name: Install Buildozer and build tools
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "legacy-cgi" "cython>=0.29.33,<3.0" virtualenv
        pip install git+https://github.com/kivy/buildozer.git

    - name: Cache only global packages / gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/packages
          ~/.gradle
        key: ${{ runner.os }}-p4a-packages-v4-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-p4a-packages-v4-

    - name: Full clean of local build tree
      run: |
        rm -rf .buildozer
        rm -rf bin
        buildozer android clean || true

    - name: Install fixed debug keystore (same signature every build)
      run: |
        mkdir -p ~/.buildozer/android ~/.android
        base64 -d keystore/ascan-debug.keystore.b64 > ~/.buildozer/android/debug.keystore
        cp ~/.buildozer/android/debug.keystore ~/.android/debug.keystore
        ls -la ~/.buildozer/android/debug.keystore
        keytool -list -keystore ~/.buildozer/android/debug.keystore -storepass android || true

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AScan-AgenT-2.0-APK
        path: bin/*.apk
        if-no-files-found: error

    - name: Upload APK to Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0-${{ github.run_number }}
        name: AScan AgenT 2.0 Build ${{ github.run_number }}
        files: bin/*.apk
        body: |
          ## AScan AgenT 2.0

          Build automatico do APK Android.

          ### Funcionalidades:
          - Interface grafica nativa
          - Escaneamento multi-servidor (ate 5)
          - Suporte a combo via arquivo
          - 5 modos de ataque
          - Controle de threads
          - Logs em tempo real
          - Salvamento automatico de hits

          ### Grupo: AScan
          ### Telegram: https://t.me/DyloExpert
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
